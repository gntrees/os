# Calamares settings for gntrees-os (kind: config, domain: installer).
#
# Module configs live next to this file in modules/<module>.conf, so no custom
# `instances` are needed: Calamares resolves each module's config by its name.
---
modules-search: [ local ]

branding: gntrees

# The live session already has a privileged user; do not ask for a second
# confirmation and do not chroot into a second-stage installer.
prompt-install: false
dont-chroot: false

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      # Remove the runtime live account before the chosen user is created.
      - removeuser
      - users
      - networkcfg
      - hwclock
      - services-systemd
      # Purges live-boot/live-config and rebuilds the initramfs.
      - shellprocess
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

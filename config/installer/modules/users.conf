# Ubuntu-style administration: the chosen user joins the existing "sudo" group,
# and root stays locked.
---
defaultGroups:
    - name: sudo
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - audio

sudoersGroup: "sudo"
setRootPassword: false
doAutologin: false

user:
    shell: /bin/bash
    forbidden_names: [ root ]
    home_permissions: "o700"

# Calamares finished page (kind: config, domain: installer).
#
# The live medium is an installer, not a desktop: finishing must reboot straight
# away so the session never falls through to the greeter. Without this the
# default is `user-unchecked`, and Done would leave the user at a login prompt
# on the live medium.
---
restartNowMode: always
restartNowCommand: "systemctl -i reboot"

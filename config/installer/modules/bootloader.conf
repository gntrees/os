# GRUB covers both firmware types, which is the compatibility goal.
#
# Calamares' bootloader module reads every key below unconditionally; a config
# with only efiBootLoader/installEFIFallback crashes at install time with
# KeyError: 'grubInstall'. Keep the full GRUB key set from the upstream default.
---
efiBootLoader: "grub"

# systemd-boot/refind settings, kept so the module config stays complete.
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
loaderEntries:
  - "timeout 5"
  - "console-mode keep"
kernelParams: [ "quiet" ]

grubInstall: "/usr/local/lib/gntrees/grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

installEFIFallback: true

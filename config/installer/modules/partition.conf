# Partitioning: one ext4 root plus the UEFI ESP. zram handles swap, so no swap
# partition is created. LUKS is available as an opt-in checkbox.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"

userSwapChoices:
    - none
    - file
drawNestedPartitions: false
alwaysShowPartitionLabels: true

# Never preselect "erase": the user must choose explicitly.
initialPartitioningChoice: none
initialSwapChoice: none

defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4" ]
allowManualPartitioning: true

# GRUB cannot unlock LUKS2 with Argon2id, so keep LUKS1 for encrypted installs.
enableLuksAutomatedPartitioning: true
luksGeneration: luks1

# ClearMounts must not tear down the live medium this installer runs from
# (live-boot mounts it, and Ventoy exposes extra mounts of its own).
essentialMounts: [ "live-*", "control", "ventoy" ]

# Build configuration (kind: config, domain: build).
# Sourced by scripts/lib.sh. Never put secrets here.

GNTRESS_NAME="gntress-os"
GNTRESS_VERSION="0.1.0"
GNTRESS_CODENAME="genesis"

GNTRESS_DISTRO="ubuntu"
GNTRESS_SUITE="resolute"
GNTRESS_ARCH="amd64"
GNTRESS_MIRROR="http://archive.ubuntu.com/ubuntu"

GNTRESS_COSMIC_EPOCH="epoch-1.11.0"

# Artifacts live outside the repo: the working tree is on NTFS.
GNTRESS_BUILD_DIR="${GNTRESS_BUILD_DIR:-$HOME/.cache/gntress-os}"
GNTRESS_SRC_DIR="$GNTRESS_BUILD_DIR/src"
GNTRESS_CACHE_DIR="$GNTRESS_BUILD_DIR/cache"
GNTRESS_CARGO_DIR="$GNTRESS_CACHE_DIR/cargo"
GNTRESS_TARGET_DIR="$GNTRESS_CACHE_DIR/target"
GNTRESS_ROOTFS_DIR="$GNTRESS_BUILD_DIR/rootfs"
GNTRESS_LIVE_DIR="$GNTRESS_BUILD_DIR/live"
GNTRESS_OUT_DIR="${GNTRESS_OUT_DIR:-$GNTRESS_BUILD_DIR/out}"

# Ryzen 3 3250U: 2 cores / 4 threads.
GNTRESS_JOBS="${GNTRESS_JOBS:-2}"

GNTRESS_BUILDER_IMAGE="gntress/build:ubuntu"
GNTRESS_ISO_IMAGE="gntress/iso:ubuntu"
GNTRESS_VM_IMAGE="gntress/vm:ubuntu"

# Partitioning: one ext4 root plus the UEFI ESP. zram handles swap, so no swap
# partition is created. LUKS is available as an opt-in checkbox.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"

userSwapChoices:
    - none
    - file
drawNestedPartitions: false
alwaysShowPartitionLabels: true

# Never preselect "erase": the user must choose explicitly.
initialPartitioningChoice: none
initialSwapChoice: none

defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4" ]
allowManualPartitioning: true

# Spell the automated layout out instead of relying on Calamares' built-in
# fallback entry. In Calamares 3.3.14 that fallback is constructed with the
# short PartitionEntry constructor, which leaves partOnlyPresentWithEncryption
# uninitialised; when the garbage value is true, createPartitions() skips the
# root entry and "Erase disk" produces an ESP with nothing else. Entries parsed
# from this list go through the fully-initialised constructor (the flag defaults
# to false), so the root partition is always created.
partitionLayout:
    - name: root
      mountPoint: "/"
      filesystem: ext4
      size: "100%"

# GRUB cannot unlock LUKS2 with Argon2id, so keep LUKS1 for encrypted installs.
enableLuksAutomatedPartitioning: true
luksGeneration: luks1

# ClearMounts must not tear down the live medium this installer runs from
# (live-boot mounts it, and Ventoy exposes extra mounts of its own).
essentialMounts: [ "live-*", "control", "ventoy" ]

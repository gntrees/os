# Build configuration (kind: config, domain: build).
# Sourced by scripts/lib.sh. Never put secrets here.

GNTREES_NAME="gntrees-os"
GNTREES_VERSION="0.1.0"
GNTREES_CODENAME="genesis"

GNTREES_DISTRO="ubuntu"
GNTREES_SUITE="resolute"
GNTREES_ARCH="amd64"
GNTREES_MIRROR="http://archive.ubuntu.com/ubuntu"

GNTREES_COSMIC_EPOCH="epoch-1.11.0"

# Release train stamped into the COSMIC .debs; component names stay upstream.
GNTREES_COSMIC_VERSION="1.11.0"

# Artifacts live outside the repo: the working tree is on NTFS.
GNTREES_BUILD_DIR="${GNTREES_BUILD_DIR:-$HOME/.cache/gntrees-os}"
GNTREES_SRC_DIR="$GNTREES_BUILD_DIR/src"
GNTREES_CACHE_DIR="$GNTREES_BUILD_DIR/cache"
GNTREES_CARGO_DIR="$GNTREES_CACHE_DIR/cargo"
GNTREES_TARGET_DIR="$GNTREES_CACHE_DIR/target"
GNTREES_ROOTFS_DIR="$GNTREES_BUILD_DIR/rootfs"
GNTREES_LIVE_DIR="$GNTREES_BUILD_DIR/live"
GNTREES_OUT_DIR="${GNTREES_OUT_DIR:-$GNTREES_BUILD_DIR/out}"

# Packages built from the staged rootfs, and the APT tree built from them.
GNTREES_DEB_REV="${GNTREES_DEB_REV:-1}"
GNTREES_DEB_DIR="${GNTREES_DEB_DIR:-$GNTREES_BUILD_DIR/deb}"
# Per-component install trees; `just stage` fills them, `just deb` packages them.
GNTREES_PKG_DIR="${GNTREES_PKG_DIR:-$GNTREES_BUILD_DIR/pkg}"
GNTREES_APT_DIR="${GNTREES_APT_DIR:-$GNTREES_BUILD_DIR/apt}"
GNTREES_APT_SUITE="stable"
GNTREES_PACKAGES_HOST="packages-os.gntrees.com"
GNTREES_APT_PREFIX="apt"
GNTREES_APT_URL="${GNTREES_APT_URL:-https://$GNTREES_PACKAGES_HOST/$GNTREES_APT_PREFIX}"

# Ryzen 3 3250U: 2 cores / 4 threads.
GNTREES_JOBS="${GNTREES_JOBS:-2}"

GNTREES_BUILDER_IMAGE="gntrees/build:ubuntu"
GNTREES_ISO_IMAGE="gntrees/iso:ubuntu"
GNTREES_VM_IMAGE="gntrees/vm:ubuntu"
